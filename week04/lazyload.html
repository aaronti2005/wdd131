<!DOCTYPE html>
<html lang="en">
<head>

    <title>Lazy Load - example</title>
    <meta name="author" content="Aaron Stick Martinez Zambrano">
    <meta name="description" content="This is a examplo of the use of lazy load to different uses.">
    <link rel="stylesheet" href="styles/lazyload.css">

<body>
    <main>
        <h1>Lazy Load in different images</h1>
        <img src="images/image-1.webp" alt="image 1 Uruguay" loading="lazy" width="400" height="600">
        <img src="images/image-2.webp" alt="image 2 Uruguay" loading="lazy" width="400" height="600">
        <img src="images/image-3.webp" alt="image 3 Uruguay" loading="lazy" width="400" height="600">
        <img src="images/image-4.webp" alt="image 4 Uruguay" loading="lazy" width="400" height="600">
        <img src="images/image-5.webp" alt="image 5 Uruguay" loading="lazy" width="400" height="600">
        <img src="images/image-6.webp" alt="image 6 Uruguay" loading="lazy" width="400" height="710">
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> ❇️Aaron Stick Martinez Zambrano❇️ Ecuador</p>

</html>
